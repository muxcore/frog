[package]
name = "frog"
version = "0.2.0"
edition = "2021"
description = "Terminal Oracle client - inspired by Toad, tmux, btop"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }
oracle = { version = "0.6", features = ["chrono"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
serde_json = "1"
uuid = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = "0.4"
unicode-width = "0.2"
anyhow = "1.0"
arboard = "3"
rpassword = "7"

[profile.release]
opt-level = 2